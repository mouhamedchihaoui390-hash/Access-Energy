<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="500" height="160" fill="none">
  <!-- Left Circuit & A Emblem -->
  <g transform="translate(10, 10)">
    <!-- Circuit lines left -->
    <path d="M 40 45 L 15 45 M 15 45 L 8 45" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="45" r="3.5" fill="#f97316"/>
    
    <path d="M 32 65 L 10 65" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="8" cy="65" r="3.5" fill="#f97316"/>

    <path d="M 38 85 L 18 85" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="16" cy="85" r="3.5" fill="#f97316"/>

    <!-- Circuit lines right -->
    <path d="M 100 45 L 125 45" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="127" cy="45" r="3.5" fill="#f97316"/>

    <path d="M 105 65 L 132 65" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="134" cy="65" r="3.5" fill="#f97316"/>

    <path d="M 98 85 L 122 85" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="124" cy="85" r="3.5" fill="#f97316"/>

    <!-- Circular Split Arc -->
    <!-- Top-left cyan/blue arc -->
    <path d="M 35 32 A 50 50 0 0 1 105 32" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 22 55 A 50 50 0 0 1 35 32" stroke="#0284c7" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    
    <!-- Bottom-right orange arc -->
    <path d="M 118 78 A 50 50 0 0 1 68 118" stroke="#f97316" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <path d="M 68 118 A 50 50 0 0 1 30 102" stroke="#f97316" stroke-width="4.5" stroke-linecap="round" fill="none"/>

    <!-- Stylized Dark Navy 'A' Frame -->
    <!-- Left leg of A -->
    <path d="M 68 14 L 32 108 L 47 108 L 68 45 L 75 62 L 62 62 L 58 73 L 79 73 L 88 100 L 98 108 L 84 108 Z" fill="#0f172a"/>
    <path d="M 68 14 L 102 108 L 87 108 L 68 45 Z" fill="#1e293b"/>

    <!-- Orange / Amber Lightning Bolt in the middle -->
    <polygon points="69,32 57,68 68,68 61,98 80,58 69,58" fill="#f59e0b"/>
    <polygon points="69,32 62,64 70,64 63,94 77,59 69,59" fill="#ea580c"/>

    <!-- Lower right accent bar of A -->
    <path d="M 88 84 L 98 108 L 86 108 Z" fill="#64748b"/>
  </g>

  <!-- Typography: ACCESS ENERGY -->
  <g transform="translate(170, 25)">
    <!-- "ACCESS" with green accent on E -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#0f172a" letter-spacing="3">
      ACC<tspan fill="#0f172a">E</tspan>SS
    </text>
    <!-- Green Accent Bar on the upper line of E -->
    <rect x="110" y="21" width="30" height="7" rx="3.5" fill="#16a34a"/>

    <!-- "ENERGY" in Orange with wide spacing -->
    <text x="5" y="90" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#ea580c" letter-spacing="14">
      ENERGY
    </text>

    <!-- Subtitle: - VOTRE ÉNERGIE NOTRE VISION DU FUTUR - -->
    <text x="5" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10.5" fill="#64748b" letter-spacing="2.5">
      - VOTRE ÉNERGIE NOTRE VISION DU FUTUR -
    </text>
  </g>
</svg>
